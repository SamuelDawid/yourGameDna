databaseChangeLog:
  - changeSet:
      id: 001-create-player-table
      author: Samuel Dawid
      changes:
        - createTable:
            tableName: player
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_player
              - column:
                  name: user_name
                  type: varchar(30)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: varchar
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: bio
                  type: varchar(2000)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: timestamp