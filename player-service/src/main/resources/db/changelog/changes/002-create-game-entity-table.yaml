databaseChangeLog:
  - changeSet:
      id: 002
      author: samuel dawid
      changes:
        - createTable:
            tableName: game_rating
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_game_rating
              - column:
                  name: game_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: rawg_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: rating
                  type: integer
              - column:
                  name: game_play_rating
                  type: integer
              - column:
                  name: graphics_rating
                  type: integer
              - column:
                  name: story_rating
                  type: integer
              - column:
                  name: monetization_rating
                  type: integer
              - column:
                  name: review
                  type: varchar(2000)
              - column:
                  name: created_at
                  type: timestamp
