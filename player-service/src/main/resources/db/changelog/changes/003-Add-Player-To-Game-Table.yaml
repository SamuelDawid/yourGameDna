databaseChangeLog:
  - changeSet:
      id: 003
      author: Samuel Dawid
      changes:
        - addColumn:
            tableName: game_rating
            columns:
              - column:
                  name: player_id
                  type: bigint
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_game_player
            baseTableName: game_rating
            baseColumnNames: player_id
            referencedTableName: player
            referencedColumnNames: id
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: game_rating
            columnNames: player_id, rawg_id
            constraintName: uk_game_rating_player_game
